<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d14" />
    <title>Red Team Live — La Casa de Uranio</title>
    <link rel="stylesheet" href="/src/companion/style.css" />
  </head>
  <body>
    <div id="companion">
      <header class="masthead">
        <a class="brand" href="./" title="Open the game"
          ><span id="board-mode">RED TEAM</span> <span id="simulation-label">SIMULATION</span></a
        >
        <div class="screen-tools">
          <span id="connection" class="connection" role="status"
            >CONNECTING</span
          ><button id="fullscreen" type="button" aria-label="Toggle fullscreen">
            ⛶ <span>Fullscreen</span>
          </button>
        </div>
      </header>
      <div
        id="connection-notice"
        class="connection-notice"
        role="status"
        hidden
      ></div>
      <main id="viewport">
        <div id="display">
          <section class="waiting">
            <h1>Waiting for the next round.</h1>
            <p>Open the game in this browser. This board follows automatically.</p>
            <div id="sources"></div>
            <a class="action" href="./" target="_blank">Open the game ↗</a>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/src/companion/main.ts"></script>
  </body>
</html>
