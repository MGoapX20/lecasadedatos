<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live map — La Casa de Datos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#e5ebed;font:15px system-ui;height:100dvh;display:flex;flex-direction:column}header{padding:16px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid #34404c}h1{font-size:21px;margin:0}select{max-width:270px;background:#23313d;color:white;border:1px solid #657585;padding:7px;border-radius:4px}#status{color:#aabdc9}main{min-height:0;flex:1;position:relative;padding:12px}canvas{width:100%;height:100%;display:block}#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#aabdc9;pointer-events:none}#empty[hidden]{display:none}footer{padding:10px 20px;display:flex;flex-wrap:wrap;gap:9px 18px;font-size:12px;border-top:1px solid #34404c}footer span:before{content:'';display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--c);border-radius:2px}a{color:#f1d77d}label{display:flex;align-items:center;gap:8px}
</style></head><body>
<header><h1>Live map</h1><label>Game <select id="sessions" aria-label="Game session"><option value="">Waiting for a game…</option></select></label><output id="status">Connecting…</output><a href="./" target="_blank">Open game ↗</a></header>
<main><canvas id="map" aria-label="Live top-down map of the nuclear base and pavement"></canvas><div id="empty">Open or reload the game in another tab.<br>This page follows its live state.</div></main>
<footer><span style="--c:#f04452">Player (white outline)</span><span style="--c:#ef6e78">AI attackers</span><span style="--c:#62aaff">Guards / cameras</span><span style="--c:#59ced1">Power</span><span style="--c:#bb97ee">Uniform / card</span><span style="--c:#667078">Used / inactive</span><span style="--c:#d4dde0">Walls</span><span style="--c:#1a252d">Blocking objects</span><span style="--c:#ed7280">Locked door</span><span style="--c:#69c796">Open door / breach</span><span style="--c:#79a5d3">Truck / vent / sewer</span><span style="--c:#c6a667">Supply stand / documents</span></footer>
<script type="module" src="/src/minimap/main.ts"></script></body></html>
